[project]
name = "censys"
version = "2.3.0"
description = "An easy-to-use and lightweight API wrapper for Censys APIs (censys.io)."
authors = [{ name = "Censys, Inc.", email = "support@censys.io" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["censys", "api", "search", "attack surface management"]
classifiers = [
    "Typing :: Typed",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
    "Environment :: Console",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.0",
    "backoff>=2.0.0,<3.0.0",
    "rich>=10.16.2",
    "argcomplete>=2.0.0,<4.0.0",
]

[project.urls]
"Censys Homepage" = "https://censys.io/"
"Censys Search" = "https://search.censys.io/"
"Discussions" = "https://github.com/censys/censys-python/discussions"
"Documentation" = "https://censys-python.rtfd.io"
"Changelog" = "https://github.com/censys/censys-python/releases"
"Tracker" = "https://github.com/censys/censys-python/issues"
"Source" = "https://github.com/censys/censys-python"

[project.scripts]
censys = "censys.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=7.3,<10",
    "pytest-cov>=4",
    "pytest-mock>=3.10.0,<4",
    "responses>=0.23.1",
    "mypy>=1.5.1,<3",
    "types-requests>=2.29.0.0,<3",
]
docs = [
    "sphinx>=7.2.6",
    "sphinxcontrib-autoprogram>=0.1.9",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-prompt>=1.8.0",
    "sphinx-tabs>=3.4.1",
    "sphinx-copybutton>=0.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["censys"]

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "PT",      # flake8-pytest-style
    "SIM",     # flake8-simplify
]
ignore = [
    "E501",   # line too long — ruff format is the source of truth; remaining are unfixable literals
    "N818",   # exception naming — renaming CensysException* would be a breaking API change
    "PT028",  # test default args — false positive for test utility helpers, not fixtures
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["censys"]

[tool.mypy]
python_version = "3.9"
files = ["censys"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = ["rich", "attr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov -rs"
filterwarnings = ["ignore:.*:DeprecationWarning:.*"]
python_classes = ["Test*", "*Tests", "*Test"]
