[tool.poetry]
name = "censys"
version = "2.2.19"
description = "An easy-to-use and lightweight API wrapper for Censys APIs (censys.io)."
authors = ["Censys, Inc. <support@censys.io>"]
license = "Apache-2.0"
readme = "README.md"
include = ["censys/py.typed"]
keywords = ["censys", "api", "search", "attack surface management"]
classifiers = [
    "Typing :: Typed",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
    "Environment :: Console",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.poetry.urls]
"Censys Homepage" = "https://censys.io/"
"Censys Search" = "https://search.censys.io/"
"Discussions" = "https://github.com/censys/censys-python/discussions"
"Documentation" = "https://censys-python.rtfd.io"
"Changelog" = "https://github.com/censys/censys-python/releases"
"Tracker" = "https://github.com/censys/censys-python/issues"
"Source" = "https://github.com/censys/censys-python"

[tool.poetry.scripts]
censys = "censys.cli:main"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
requests = ">=2.29.0"
urllib3 = "<3.0.0"
backoff = ">=2.0.0,<3.0.0"
rich = ">=10.16.2"
argcomplete = ">=2.0.0,<4.0.0"

[tool.poetry.group.dev.dependencies]
# Lint
ruff = ">=0.9.0"
# Tests
pytest = ">=7.3,<9.0"
pytest-cov = ">=4,<6"
pytest-mock = "^3.10.0"
responses = ">=0.23.1,<0.26.0"
parameterized = "^0.9.0"
# Types
mypy = "^1.5.1"
types-requests = "^2.29.0.0"

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "PT",      # flake8-pytest-style
    "SIM",     # flake8-simplify
]
ignore = [
    "E501",   # line too long — ruff format is the source of truth; remaining are unfixable literals
    "N818",   # exception naming — renaming CensysException* would be a breaking API change
    "PT028",  # test default args — false positive for test utility helpers, not fixtures
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["censys"]

[tool.mypy]
python_version = "3.9"
files = ["censys"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["parameterized", "rich", "attr"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"
